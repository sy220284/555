name: content-validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate authoritative data
        run: python Tools/content_validator.py
      - name: Validate embedded package structure
        run: python Tools/project_structure_validator.py
