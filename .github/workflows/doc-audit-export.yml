name: 文档审计导出

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/doc-audit-export.yml

permissions:
  contents: read

jobs:
  export-docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Collect documentation and source text
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, shutil

          root = Path('.')
          docs_out = Path('.doc-audit-export')
          src_out = Path('.source-audit-export')
          docs_out.mkdir()
          src_out.mkdir()
          inventory = []

          doc_excluded_prefixes = (
              'vendor/',
              '.agents/skills/',
              'node_modules/',
              '.doc-audit-export/',
              '.source-audit-export/',
          )
          doc_excluded_files = {'THIRD_PARTY_NOTICES.md'}

          for path in sorted(root.rglob('*.md')):
              rel = path.as_posix()
              if rel in doc_excluded_files or any(rel.startswith(p) for p in doc_excluded_prefixes):
                  continue
              if not path.is_file():
                  continue
              data = path.read_bytes()
              dest = docs_out / rel
              dest.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(path, dest)
              inventory.append({
                  'path': rel,
                  'bytes': len(data),
                  'lines': data.count(b'\n') + (0 if data.endswith(b'\n') or not data else 1),
                  'sha256': hashlib.sha256(data).hexdigest(),
              })

          (docs_out / '_inventory.json').write_text(
              json.dumps(inventory, ensure_ascii=False, indent=2),
              encoding='utf-8',
          )

          text_suffixes = {
              '.ts', '.tsx', '.mts', '.cts', '.js', '.mjs', '.cjs',
              '.json', '.yml', '.yaml', '.toml', '.py', '.sh', '.md', '.txt',
          }
          source_excluded_prefixes = (
              '.git/', 'vendor/', 'node_modules/', '.doc-audit-export/', '.source-audit-export/',
          )
          source_inventory = []
          for path in sorted(root.rglob('*')):
              rel = path.as_posix()
              if not path.is_file() or any(rel.startswith(p) for p in source_excluded_prefixes):
                  continue
              if path.suffix.lower() not in text_suffixes and path.name not in {'package.json', 'pnpm-workspace.yaml'}:
                  continue
              try:
                  data = path.read_bytes()
                  data.decode('utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              dest = src_out / rel
              dest.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(path, dest)
              source_inventory.append({'path': rel, 'bytes': len(data)})

          (src_out / '_inventory.json').write_text(
              json.dumps(source_inventory, ensure_ascii=False, indent=2),
              encoding='utf-8',
          )
          print(f'Collected {len(inventory)} Markdown files and {len(source_inventory)} source/config text files')
          PY
      - name: Upload documentation audit bundle
        uses: actions/upload-artifact@v4
        with:
          name: documentation-audit-bundle
          path: .doc-audit-export
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - name: Upload source audit bundle
        uses: actions/upload-artifact@v4
        with:
          name: source-audit-bundle
          path: .source-audit-export
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
