name: 完成工作台源码内生迁移

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-native-workbench.yml'
      - '.github/migrate-native-workbench.sh'

permissions:
  contents: write

concurrency:
  group: finalize-native-workbench
  cancel-in-progress: false

env:
  NODE_VERSION: '22.19.0'
  PNPM_VERSION: '11.7.0'
  WORKBENCH_VERSION: '1.0.0'
  UPSTREAM_VERSION: '0.1.1-rc.2'
  UPSTREAM_COMMIT: 'b150a551b8d465e31e418e1b2eaf5e79bbb7d28e'

jobs:
  migrate:
    name: 根目录迁移并完整验收
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout 555
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup exact Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable exact pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          node --version
          pnpm --version

      - name: Patch package-bin launchers and optional clangd
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('.github/migrate-native-workbench.sh')
          text = path.read_text()

          replacements = {
              "const entry = require.resolve('typescript-language-server')\nawait import(pathToFileURL(entry).href)":
                  "const entry = new URL('../../node_modules/typescript-language-server/lib/cli.mjs', import.meta.url)\nawait import(entry.href)",
              "const entry = require.resolve('@modelcontextprotocol/server-filesystem')\nawait import(pathToFileURL(entry).href)":
                  "const entry = new URL('../../node_modules/@modelcontextprotocol/server-filesystem/dist/index.js', import.meta.url)\nawait import(entry.href)",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one launcher anchor, got {count}: {old!r}')
              text = text.replace(old, new, 1)

          clangd_pattern = r"\n          clangd:\n.*?(?=\n    - id: tool-lsp)"
          clangd_entry = (
              "\n    - id: lsp-stdio-clangd\n"
              "      name: '@deepseek-ai/dsh-lsp-stdio'\n"
              "      disabled: !!js !process.env.DSH_CLANGD_BIN\n"
              "      config:\n"
              "        servers:\n"
              "          clangd:\n"
              "            command: !!js process.env.DSH_CLANGD_BIN\n"
              "            args: [--background-index]\n"
              "            extensionToLanguage:\n"
              "              .c: c\n"
              "              .h: c\n"
              "              .cc: cpp\n"
              "              .cpp: cpp\n"
              "              .cxx: cpp\n"
              "              .hh: cpp\n"
              "              .hpp: cpp\n"
          )
          text, count = re.subn(clangd_pattern, clangd_entry, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'expected exactly one clangd server block, got {count}')

          old_doc = '`clangd` 可通过 `DSH_CLANGD_BIN` 指定。'
          new_doc = '`clangd` 为可选外部依赖；仅在设置 `DSH_CLANGD_BIN` 时启用 C/C++ 语言服务，缺少它不会阻断工作台启动。'
          if old_doc not in text:
              raise SystemExit('clangd documentation anchor not found')
          text = text.replace(old_doc, new_doc, 1)

          path.write_text(text)
          PY

      - name: Run one-time native migration
        shell: bash
        run: |
          set +e
          bash -x .github/migrate-native-workbench.sh 2>&1 | tee /tmp/native-migration.log
          rc=${PIPESTATUS[0]}
          {
            echo "migration_exit_code=${rc}"
            echo '--- last 200 migration log lines ---'
            tail -n 200 /tmp/native-migration.log
            echo '--- workbench native server log ---'
            tail -n 200 "${RUNNER_TEMP}/workbench-native.log" 2>/dev/null || true
          } > /tmp/native-migration-diagnostic.txt
          exit "$rc"

      - name: Upload failure diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-migration-diagnostic
          path: /tmp/native-migration-diagnostic.txt
          if-no-files-found: error
          retention-days: 3
