name: local-bootstrap

on:
  push:
    branches:
      - tooling/local-dotnet8-artifact-20260912
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Package latest .NET 8 runtime patch
        run: |
          RUNTIME_VERSION="$(dotnet --list-runtimes | awk '$1 == "Microsoft.NETCore.App" && $2 ~ /^8\./ {print $2}' | sort -V | tail -1)"
          test -n "$RUNTIME_VERSION"
          mkdir -p /tmp/dotnet-runtime8/shared/Microsoft.NETCore.App /tmp/dotnet-runtime8/host/fxr
          cp -a "/usr/share/dotnet/shared/Microsoft.NETCore.App/$RUNTIME_VERSION" /tmp/dotnet-runtime8/shared/Microsoft.NETCore.App/
          cp -a "/usr/share/dotnet/host/fxr/$RUNTIME_VERSION" /tmp/dotnet-runtime8/host/fxr/
          printf '%s\n' "$RUNTIME_VERSION" > /tmp/dotnet-runtime8/runtime-version.txt
          tar -C /tmp -czf /tmp/dotnet8-runtime-patch.tar.gz dotnet-runtime8
      - uses: actions/upload-artifact@v7
        with:
          name: dotnet8-runtime-patch-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/dotnet8-runtime-patch.tar.gz
          if-no-files-found: error
          compression-level: 1
          retention-days: 1
