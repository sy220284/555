name: local-first-pr

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  local-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate local-first PR evidence
        env:
          LOCAL_PR_BODY: ${{ github.event.pull_request.body }}
        run: python Tools/pr_local_evidence_validator.py
      - name: Run local-first validator regression tests
        run: python -m unittest Tests/test_pr_local_evidence_validator.py -v
