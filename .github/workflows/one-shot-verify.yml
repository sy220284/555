name: one-shot-verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'

      - name: 启用 pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          pnpm --version

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 完整构建
        run: pnpm run build

      - name: 执行产品测试并保留日志
        shell: bash
        run: |
          set +e
          pnpm exec vitest run apps packages > product-test.log 2>&1
          code=$?
          echo "$code" > product-test-exit-code.txt
          echo '=== 测试失败摘要 ==='
          grep -E -B 3 -A 10 'FAIL|Error:|Cannot find|ENOENT|AssertionError|Test Files|Tests ' product-test.log | tail -n 400 || true
          exit 0

      - name: 上传产品测试日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-test-log
          path: |
            product-test.log
            product-test-exit-code.txt

      - name: 判定产品测试结果
        shell: bash
        run: |
          code=$(cat product-test-exit-code.txt)
          echo "产品测试退出码: $code"
          exit "$code"
