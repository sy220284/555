name: one-shot-verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'

      - name: 启用 pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          pnpm --version

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 完整构建
        run: pnpm run build

      - name: 产品测试
        run: pnpm exec vitest run apps packages
