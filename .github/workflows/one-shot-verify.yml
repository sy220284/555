name: one-shot-verify

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'

      - name: 启用 pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          pnpm --version

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 完整构建
        run: pnpm run build

      - name: 执行有效产品测试并保留日志
        shell: bash
        run: |
          set +e
          pnpm exec vitest run apps packages \
            --exclude apps/cli/tests/memory-mcp-configs.spec.ts \
            --exclude packages/shell/tool-pwsh/tests/loader.spec.ts \
            --exclude packages/typert/generator/tests/cordis-catalog.spec.ts \
            > effective-test.log 2>&1
          code=$?
          echo "$code" > effective-test-exit-code.txt
          echo '=== 测试失败摘要 ==='
          grep -E -B 3 -A 12 'FAIL|Error:|Cannot find|ENOENT|AssertionError|Test Files|Tests ' effective-test.log | tail -n 500 || true
          exit 0

      - name: 上传有效产品测试日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: effective-test-log
          path: |
            effective-test.log
            effective-test-exit-code.txt

      - name: 判定有效产品测试结果
        shell: bash
        run: |
          code=$(cat effective-test-exit-code.txt)
          echo "有效产品测试退出码: $code"
          exit "$code"
