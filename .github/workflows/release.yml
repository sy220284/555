name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 必须等于 v<package.json version>
        required: true
        type: string

permissions:
  contents: write
  pull-requests: read
  statuses: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: 检出精确主线提交
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with: { version: 11.7.0 }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.1
          cache: pnpm
      - name: 验证标签与版本一致
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const version = JSON.parse(readFileSync('package.json', 'utf8')).version
          if (process.env.RELEASE_TAG !== `v${version}`) throw new Error(`标签必须为 v${version}`)
          if (!/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/u.test(process.env.RELEASE_TAG)) throw new Error('标签格式无效')
          NODE
          node .github/governance/release.mjs self-test
      - name: 验证主线已完整交付
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/governance/repository-state.mjs assert-delivered
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm run test
      - run: git diff --exit-code
      - name: 创建不可移动的 GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: node .github/governance/release.mjs create
