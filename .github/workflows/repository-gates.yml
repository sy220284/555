name: repository-gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-policy:
    name: repository-policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 校验仓库范围与临时产物
        shell: bash
        run: |
          set -euo pipefail
          forbidden_roots=(docs examples website assets)
          for path in "${forbidden_roots[@]}"; do
            if [[ -e "$path" ]]; then
              echo "禁止的仓库根目录重新出现: $path" >&2
              exit 1
            fi
          done
          if git ls-files | grep -E '(^|/)(node_modules|coverage|\.venv|__pycache__)(/|$)' >/dev/null; then
            echo "检测到被提交的依赖、覆盖率或本地环境产物" >&2
            git ls-files | grep -E '(^|/)(node_modules|coverage|\.venv|__pycache__)(/|$)' >&2
            exit 1
          fi
          if git ls-files | grep -E '(^|/)\.env($|\.)|\.(pem|key)$' >/dev/null; then
            echo "检测到疑似凭据或私密环境文件" >&2
            git ls-files | grep -E '(^|/)\.env($|\.)|\.(pem|key)$' >&2
            exit 1
          fi

      - name: 校验根工程约束
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'))
          if (pkg.packageManager !== 'pnpm@11.7.0') throw new Error(`packageManager 漂移: ${pkg.packageManager}`)
          if (pkg.engines?.node !== '^22.19.0 || >=24.0.0') throw new Error(`Node.js 版本约束漂移: ${pkg.engines?.node}`)
          NODE
          test -f pnpm-lock.yaml
          test -f pnpm-workspace.yaml
          test -f AGENTS.md
          test -f README.md

  node-22:
    name: node-22-floor
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
      - name: 配置 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - name: 配置 Node.js 22.19
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - name: 冻结安装依赖
        run: pnpm install --frozen-lockfile
      - name: 类型检查
        run: pnpm run typecheck
      - name: 完整构建
        run: pnpm run build
      - name: 确认构建未改写受控文件
        run: git diff --exit-code

  node-24:
    name: node-24-quality
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
      - name: 配置 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - name: 配置 Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: 冻结安装依赖
        run: pnpm install --frozen-lockfile
      - name: 类型检查
        run: pnpm run typecheck
      - name: 完整构建
        run: pnpm run build
      - name: 临时隔离仓库范围外测试
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            apps/cli/tests/memory-mcp-configs.spec.ts \
            packages/shell/tool-pwsh/tests/loader.spec.ts \
            packages/typert/generator/tests/cordis-catalog.spec.ts; do
            mv "$file" "$file.repository-gate-disabled"
          done
      - name: 单元测试与逐文件覆盖率门禁
        run: pnpm run test:coverage
      - name: 恢复仓库范围外测试
        if: always()
        shell: bash
        run: |
          for file in \
            apps/cli/tests/memory-mcp-configs.spec.ts \
            packages/shell/tool-pwsh/tests/loader.spec.ts \
            packages/typert/generator/tests/cordis-catalog.spec.ts; do
            disabled="$file.repository-gate-disabled"
            if [[ -f "$disabled" ]]; then mv "$disabled" "$file"; fi
          done
      - name: 确认验证未改写受控文件
        run: git diff --exit-code

  windows:
    name: windows-runtime
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
      - name: 配置 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - name: 配置 Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: 冻结安装依赖
        run: pnpm install --frozen-lockfile
      - name: 类型检查
        run: pnpm run typecheck
      - name: 临时隔离仓库范围外测试
        shell: pwsh
        run: |
          $files = @(
            'apps/cli/tests/memory-mcp-configs.spec.ts',
            'packages/shell/tool-pwsh/tests/loader.spec.ts',
            'packages/typert/generator/tests/cordis-catalog.spec.ts'
          )
          foreach ($file in $files) { Move-Item $file "$file.repository-gate-disabled" }
      - name: Windows 产品测试
        run: pnpm run test
      - name: 恢复仓库范围外测试
        if: always()
        shell: pwsh
        run: |
          $files = @(
            'apps/cli/tests/memory-mcp-configs.spec.ts',
            'packages/shell/tool-pwsh/tests/loader.spec.ts',
            'packages/typert/generator/tests/cordis-catalog.spec.ts'
          )
          foreach ($file in $files) {
            $disabled = "$file.repository-gate-disabled"
            if (Test-Path $disabled) { Move-Item $disabled $file }
          }
      - name: 确认验证未改写受控文件
        run: git diff --exit-code

  python-sdk:
    name: python-${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: 安装 Python 测试依赖
        run: python -m pip install "pytest>=8" "pydantic>=2.12,<3"
      - name: Python 语法编译检查
        run: python -m compileall -q python/sdk/src python/sdk-runtime/src
      - name: Python SDK 测试
        env:
          PYTHONPATH: ${{ github.workspace }}/python/sdk/src:${{ github.workspace }}/python/sdk-runtime/src
        run: python -m pytest python/sdk/tests -q
      - name: 确认测试未改写受控文件
        run: git diff --exit-code

  native-landlock:
    name: linux-landlock-native
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
      - name: 配置 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - name: 配置 Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: 安装 musl 原生编译器
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: 冻结安装依赖
        run: pnpm install --frozen-lockfile
      - name: Landlock TypeScript 边界检查
        run: pnpm --dir native/landlock-run run typecheck
      - name: 编译 Landlock C11 静态二进制
        run: pnpm --dir native/landlock-run run build:native
      - name: Landlock 启动器测试
        run: pnpm --dir native/landlock-run run test
      - name: 确认验证未改写受控文件
        run: git diff --exit-code

  merge-gate:
    name: merge-gate
    if: always()
    needs: [repository-policy, node-22, node-24, windows, python-sdk, native-landlock]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 汇总全部永久门禁
        shell: bash
        env:
          POLICY: ${{ needs.repository-policy.result }}
          NODE22: ${{ needs.node-22.result }}
          NODE24: ${{ needs.node-24.result }}
          WINDOWS: ${{ needs.windows.result }}
          PYTHON: ${{ needs.python-sdk.result }}
          NATIVE: ${{ needs.native-landlock.result }}
        run: |
          set -euo pipefail
          failed=0
          for pair in \
            "repository-policy=$POLICY" \
            "node-22-floor=$NODE22" \
            "node-24-quality=$NODE24" \
            "windows-runtime=$WINDOWS" \
            "python-sdk=$PYTHON" \
            "linux-landlock-native=$NATIVE"; do
            echo "$pair"
            if [[ "${pair#*=}" != "success" ]]; then failed=1; fi
          done
          exit "$failed"
