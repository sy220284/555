name: repository-gates

# Trust-root migration compatibility: `repository-gates / merge-gate` is retired;
# the independent task-governance, quality, security, performance and evidence jobs replace it.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-gates-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  task-governance:
    name: task-governance
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 校验仓库范围与临时产物
        shell: bash
        run: |
          set -euo pipefail
          forbidden_roots=(docs examples website assets)
          for path in "${forbidden_roots[@]}"; do
            if [[ -e "$path" ]]; then
              echo "禁止的仓库根目录重新出现: $path" >&2
              exit 1
            fi
          done
          if git ls-files | grep -E '(^|/)(node_modules|coverage|\.venv|__pycache__)(/|$)' >/dev/null; then
            echo "检测到被提交的依赖、覆盖率或本地环境产物" >&2
            exit 1
          fi
          if git ls-files | grep -E '(^|/)\.env($|\.)|\.(pem|key)$' >/dev/null; then
            echo "检测到疑似凭据或私密环境文件" >&2
            exit 1
          fi
      - name: 校验根工程约束
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'))
          if (pkg.packageManager !== 'pnpm@11.7.0') throw new Error(`packageManager 漂移: ${pkg.packageManager}`)
          if (pkg.engines?.node !== '^22.19.0 || >=24.0.0') throw new Error(`Node.js 版本约束漂移: ${pkg.engines?.node}`)
          NODE
          test -f pnpm-lock.yaml
          test -f pnpm-workspace.yaml
          test -f AGENTS.md
          test -f README.md
          test -f CODE_OF_CONDUCT.md
          test -f CONTRIBUTING.md
          test -f SECURITY.md
          test -f RELEASE.md
          test -f .github/CODEOWNERS
          test -f .github/governance/repository-policy.json
          test -f .github/repository-metadata.json
          test -f python/sdk-runtime/src/deepseek_harness_runtime/deepseek-harness-runtime.json
          test -f python/sdk-runtime/src/deepseek_harness_runtime/runtime/cordis.yml
      - name: 自测自动化治理内核
        run: |
          node .github/governance/pr-policy.mjs self-test
          node .github/governance/change-impact.mjs self-test
          node .github/governance/controlled-merge.mjs self-test
          node .github/governance/main-verification.mjs self-test
          node .github/governance/integration-synchronization.mjs self-test
          node .github/governance/branch-hygiene.mjs self-test
          node .github/governance/repository-state.mjs self-test
          node .github/governance/security-gate.mjs self-test
          node .github/governance/release.mjs self-test

  impact:
    name: change-impact
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      e2e: ${{ steps.classify.outputs.e2e }}
      web: ${{ steps.classify.outputs.web }}
      gui: ${{ steps.classify.outputs.gui }}
      snapshot: ${{ steps.classify.outputs.snapshot }}
      full: ${{ steps.classify.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: classify
        name: 计算变更风险
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node .github/governance/change-impact.mjs --base "$BASE_SHA" --head "$HEAD_SHA"

  quality:
    name: quality / quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with: { version: 11.7.0 }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build
      - name: 临时隔离仓库范围外测试
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            apps/cli/tests/memory-mcp-configs.spec.ts \
            packages/shell/tool-pwsh/tests/loader.spec.ts \
            packages/typert/generator/tests/cordis-catalog.spec.ts; do
            mv "$file" "$file.repository-gate-disabled"
          done
      - name: 单元测试与逐文件覆盖率门禁
        run: pnpm run test:coverage
      - name: 恢复仓库范围外测试
        if: always()
        shell: bash
        run: |
          for file in \
            apps/cli/tests/memory-mcp-configs.spec.ts \
            packages/shell/tool-pwsh/tests/loader.spec.ts \
            packages/typert/generator/tests/cordis-catalog.spec.ts; do
            disabled="$file.repository-gate-disabled"
            if [[ -f "$disabled" ]]; then mv "$disabled" "$file"; fi
          done
      - run: git diff --exit-code

  security:
    name: security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with: { version: 11.7.0 }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 24.18.1 }
      - name: 固定自动化依赖并扫描仓库策略
        run: node .github/governance/security-gate.mjs scan-repository
      - name: 生成生产依赖审计记录
        shell: bash
        run: pnpm audit --prod --json > "$RUNNER_TEMP/pnpm-audit.json" || true
      - name: 阻止新增、升级或 critical 安全债务
        run: node .github/governance/security-gate.mjs audit "$RUNNER_TEMP/pnpm-audit.json"

  performance:
    name: performance
    if: always()
    needs: impact
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - name: 验证风险分类可用
        env:
          IMPACT_RESULT: ${{ needs.impact.result }}
        run: test "$IMPACT_RESULT" = success
      - name: 自测性能门禁路由
        run: node .github/governance/change-impact.mjs self-test
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        if: ${{ needs.impact.outputs.web == 'true' || needs.impact.outputs.full == 'true' }}
        with: { version: 11.7.0 }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: ${{ needs.impact.outputs.web == 'true' || needs.impact.outputs.full == 'true' }}
        with:
          node-version: 24.18.1
          cache: pnpm
      - name: 冻结安装性能测试依赖
        if: ${{ needs.impact.outputs.web == 'true' || needs.impact.outputs.full == 'true' }}
        run: pnpm install --frozen-lockfile
      - name: Web 性能测试
        if: ${{ needs.impact.outputs.web == 'true' || needs.impact.outputs.full == 'true' }}
        run: pnpm run test:web:perf
      - name: Web 压力测试
        if: ${{ needs.impact.outputs.full == 'true' }}
        run: pnpm run test:web:stress
      - name: 记录性能测试不适用
        if: ${{ needs.impact.outputs.web != 'true' && needs.impact.outputs.full != 'true' }}
        run: echo "当前变更不影响性能测试面；路由策略已验证。"
      - run: git diff --exit-code

  node-22:
    name: node-22-floor
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with: { version: 11.7.0 }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: git diff --exit-code

  extended-product:
    name: extended-product-validation
    needs: impact
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - name: 无需扩展产品验证
        if: ${{ needs.impact.outputs.e2e != 'true' && needs.impact.outputs.web != 'true' && needs.impact.outputs.gui != 'true' && needs.impact.outputs.snapshot != 'true' }}
        run: echo "当前变更不触发扩展产品验证。"
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        if: ${{ needs.impact.outputs.e2e == 'true' || needs.impact.outputs.web == 'true' || needs.impact.outputs.gui == 'true' || needs.impact.outputs.snapshot == 'true' }}
        with: { version: 11.7.0 }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: ${{ needs.impact.outputs.e2e == 'true' || needs.impact.outputs.web == 'true' || needs.impact.outputs.gui == 'true' || needs.impact.outputs.snapshot == 'true' }}
        with:
          node-version: 24.18.1
          cache: pnpm
      - name: 冻结安装依赖
        if: ${{ needs.impact.outputs.e2e == 'true' || needs.impact.outputs.web == 'true' || needs.impact.outputs.gui == 'true' || needs.impact.outputs.snapshot == 'true' }}
        run: pnpm install --frozen-lockfile
      - name: 端到端测试
        if: ${{ needs.impact.outputs.e2e == 'true' }}
        run: pnpm run test:e2e
      - name: Web 测试
        if: ${{ needs.impact.outputs.web == 'true' }}
        env:
          DSH_BUILD_CLIENT_PROFILE: official
        run: pnpm run test:web
      - name: 图形界面测试
        if: ${{ needs.impact.outputs.gui == 'true' }}
        run: pnpm run test:gui
      - name: 快照测试
        if: ${{ needs.impact.outputs.snapshot == 'true' }}
        run: pnpm run test:snapshot
      - run: git diff --exit-code

  windows:
    name: windows-runtime
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with: { version: 11.7.0 }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - name: 临时隔离仓库范围外测试
        shell: pwsh
        run: |
          $files = @(
            'apps/cli/tests/memory-mcp-configs.spec.ts',
            'packages/shell/tool-pwsh/tests/loader.spec.ts',
            'packages/typert/generator/tests/cordis-catalog.spec.ts'
          )
          foreach ($file in $files) { Move-Item $file "$file.repository-gate-disabled" }
      - run: pnpm exec vitest run --maxWorkers 2
      - name: 恢复仓库范围外测试
        if: always()
        shell: pwsh
        run: |
          $files = @(
            'apps/cli/tests/memory-mcp-configs.spec.ts',
            'packages/shell/tool-pwsh/tests/loader.spec.ts',
            'packages/typert/generator/tests/cordis-catalog.spec.ts'
          )
          foreach ($file in $files) {
            $disabled = "$file.repository-gate-disabled"
            if (Test-Path $disabled) { Move-Item $disabled $file }
          }
      - run: git diff --exit-code

  macos:
    name: macos-runtime
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with: { version: 11.7.0 }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - name: 临时隔离仓库范围外测试
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            apps/cli/tests/memory-mcp-configs.spec.ts \
            packages/shell/tool-pwsh/tests/loader.spec.ts \
            packages/typert/generator/tests/cordis-catalog.spec.ts; do
            mv "$file" "$file.repository-gate-disabled"
          done
      - run: pnpm exec vitest run --maxWorkers 2
      - name: 恢复仓库范围外测试
        if: always()
        shell: bash
        run: |
          for file in \
            apps/cli/tests/memory-mcp-configs.spec.ts \
            packages/shell/tool-pwsh/tests/loader.spec.ts \
            packages/typert/generator/tests/cordis-catalog.spec.ts; do
            disabled="$file.repository-gate-disabled"
            if [[ -f "$disabled" ]]; then mv "$disabled" "$file"; fi
          done
      - run: git diff --exit-code

  python-sdk:
    name: python-${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: 0.11.33
          enable-cache: false
      - run: uv sync --project python/sdk --locked --group test --no-install-project --no-install-local
      - run: python -m compileall -q python/sdk/src python/sdk-runtime/src
      - name: Python SDK 核心测试
        env:
          PYTHONPATH: ${{ github.workspace }}/python/sdk/src:${{ github.workspace }}/python/sdk-runtime/src
        run: uv run --project python/sdk --no-sync python -m pytest -q python/sdk/tests/test_client.py python/sdk/tests/test_runtime_resolution.py
      - run: git diff --exit-code

  native-landlock:
    name: linux-landlock-native
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with: { version: 11.7.0 }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.1
          cache: pnpm
      - name: 安装 musl 原生编译器
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v musl-gcc >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends musl-tools
          fi
          musl-gcc --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir native/landlock-run run typecheck
      - run: pnpm --dir native/landlock-run run build:ts
      - run: pnpm --dir native/landlock-run run build:native
      - run: pnpm --dir native/landlock-run run test
      - run: git diff --exit-code

  evidence:
    name: evidence
    if: always()
    needs: [task-governance, impact, quality, security, performance, node-22, extended-product, windows, macos, python-sdk, native-landlock]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: 生成精确门禁证据
        env:
          TASK_GOVERNANCE: ${{ needs.task-governance.result }}
          IMPACT: ${{ needs.impact.result }}
          QUALITY: ${{ needs.quality.result }}
          SECURITY: ${{ needs.security.result }}
          PERFORMANCE: ${{ needs.performance.result }}
          NODE22: ${{ needs.node-22.result }}
          EXTENDED: ${{ needs.extended-product.result }}
          WINDOWS: ${{ needs.windows.result }}
          MACOS: ${{ needs.macos.result }}
          PYTHON: ${{ needs.python-sdk.result }}
          NATIVE: ${{ needs.native-landlock.result }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p artifacts/governance-evidence
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs'
          const results = {
            'task-governance': process.env.TASK_GOVERNANCE,
            'change-impact': process.env.IMPACT,
            'quality / quality': process.env.QUALITY,
            security: process.env.SECURITY,
            performance: process.env.PERFORMANCE,
            'node-22-floor': process.env.NODE22,
            'extended-product-validation': process.env.EXTENDED,
            'windows-runtime': process.env.WINDOWS,
            'macos-runtime': process.env.MACOS,
            'python-sdk': process.env.PYTHON,
            'linux-landlock-native': process.env.NATIVE,
          }
          const evidence = {
            schemaVersion: 1,
            repository: process.env.GITHUB_REPOSITORY,
            headSha: process.env.HEAD_SHA,
            workflowRunId: Number(process.env.GITHUB_RUN_ID),
            runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            results,
          }
          writeFileSync('artifacts/governance-evidence/gates.json', `${JSON.stringify(evidence, null, 2)}\n`)
          const failed = Object.entries(results).filter(([, result]) => result !== 'success')
          if (failed.length > 0) throw new Error(`Permanent gates failed: ${failed.map(([name, result]) => `${name}=${result}`).join(', ')}`)
          NODE
      - name: 上传不可变门禁证据
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: governance-evidence-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: artifacts/governance-evidence/
          if-no-files-found: error
          retention-days: 90
