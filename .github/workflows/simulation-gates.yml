name: simulation-gates

on:
  push:
    branches: [main]
  pull_request:

jobs:
  deterministic-sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Build deterministic rules runner
        run: dotnet build Tools/ModernRA.SimRunner/ModernRA.SimRunner.csproj -c Release
      - name: Run 10x10000-tick gates
        run: dotnet run --project Tools/ModernRA.SimRunner/ModernRA.SimRunner.csproj -c Release --no-build -- --map Data/Maps/MAP_GRAY_RANGE.map.json --ticks 10000 --repetitions 10 --units 1000
      - name: Build annihilation gameplay runner
        run: dotnet build Tools/ModernRA.AnnihilationRunner/ModernRA.AnnihilationRunner.csproj -c Release
      - name: Run deterministic annihilation gameplay closure
        run: dotnet run --project Tools/ModernRA.AnnihilationRunner/ModernRA.AnnihilationRunner.csproj -c Release --no-build -- --map Data/Maps/MAP_GRAY_RANGE.map.json
      - name: Build deterministic player command stream runner
        run: dotnet build Tools/ModernRA.CommandRunner/ModernRA.CommandRunner.csproj -c Release
      - name: Run deterministic player command stream gate
        run: dotnet run --project Tools/ModernRA.CommandRunner/ModernRA.CommandRunner.csproj -c Release --no-build
      - name: Build live player command admission runner
        run: dotnet build Tools/ModernRA.CommandInboxRunner/ModernRA.CommandInboxRunner.csproj -c Release
      - name: Run live player command admission gate
        run: dotnet run --project Tools/ModernRA.CommandInboxRunner/ModernRA.CommandInboxRunner.csproj -c Release --no-build

  local-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Package main source snapshot
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git archive --format=tar.gz --output=/tmp/555-main.tar.gz "$BASE_SHA"
      - name: Package resolved dotnet toolchain
        run: tar -C /usr/share -czf /tmp/dotnet-sdk-linux-x64.tar.gz dotnet
      - name: Upload local development bootstrap
        uses: actions/upload-artifact@v7
        with:
          name: local-dev-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/555-main.tar.gz
            /tmp/dotnet-sdk-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 1
