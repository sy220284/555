name: 同步工作台完整源码

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-full-workbench-source.yml'
      - '.github/workflows/permanent-toolchain.yml'
      - '.github/workflows/workbench-overlay-release.yml'
      - 'README.md'
      - 'VERSION'
      - 'MANIFEST.json'
      - 'bin/**'
      - 'overlay/**'
      - 'docs/**'

permissions:
  contents: write

concurrency:
  group: sync-full-workbench-source
  cancel-in-progress: false

env:
  HARNESS_REPO: deepseek-ai/deepseek-harness
  HARNESS_SHA: b150a551b8d465e31e418e1b2eaf5e79bbb7d28e
  HARNESS_VERSION: 0.1.1-rc.2
  WORKBENCH_VERSION: workbench-1.0.0

jobs:
  sync:
    name: 写入完整工作台源码
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout 555
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout exact DeepSeek Harness source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.HARNESS_REPO }}
          ref: ${{ env.HARNESS_SHA }}
          path: .source-upstream
          persist-credentials: false

      - name: Verify exact upstream source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .source-upstream rev-parse HEAD)" = "$HARNESS_SHA"
          node -e "const p=require('./.source-upstream/package.json'); if(p.version!==process.env.HARNESS_VERSION) throw new Error('Harness version mismatch: '+p.version)"

      - name: Assemble complete modified source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf workbench-src
          mkdir -p workbench-src
          rsync -a --delete --exclude='.git' .source-upstream/ workbench-src/
          rm -rf .source-upstream

          # 将工作台全部改造内容嵌入完整源码树，保证单目录即可审计和继续开发。
          mkdir -p workbench-src/.workbench
          cp -a bin overlay docs MANIFEST.json VERSION README.md workbench-src/.workbench/
          mkdir -p workbench-src/.workbench/github-workflows
          cp .github/workflows/permanent-toolchain.yml workbench-src/.workbench/github-workflows/
          cp .github/workflows/workbench-overlay-release.yml workbench-src/.workbench/github-workflows/
          cp .github/workflows/sync-full-workbench-source.yml workbench-src/.workbench/github-workflows/

          cat > workbench-src/WORKBENCH_SOURCE.md <<EOF
          # 工作台完整源码

          本目录是工作台的完整可审计源码树，不是只有补丁或改造说明。

          - 上游：${HARNESS_REPO}
          - 上游固定提交：${HARNESS_SHA}
          - DeepSeek Harness：${HARNESS_VERSION}
          - 工作台版本：${WORKBENCH_VERSION}
          - 工作台改造目录：\`.workbench/\`

          ## 目录说明

          - Harness 原始完整源码：本目录除 \`.workbench/\`、\`WORKBENCH_SOURCE.md\` 与 \`WORKBENCH_SOURCE_MANIFEST.json\` 外的全部内容。
          - 工作台接管预设、技能、MCP/LSP、脚本、文档和发布工作流：\`.workbench/\`。
          - 永久离线运行产物仍由 555 Release 管理；源码树不提交 \`node_modules\`、缓存和本机构建垃圾。

          ## 同步规则

          根仓库中的工作台脚本、配置、技能、文档或相关工作流变化时，本目录会由 GitHub Actions 自动重建并提交，避免完整源码树与改造层版本漂移。

          ## 改造定位

          当前工作台采用非侵入式覆盖层设计，尽量不修改上游核心文件。这样既完整保存上游源码，又能清晰定位所有工作台差异。完整改造说明见：

          - \`.workbench/docs/MODIFICATIONS.md\`
          - \`.workbench/docs/CAPABILITIES.md\`
          - \`.workbench/docs/DEPLOYMENT.md\`
          - \`.workbench/docs/TROUBLESHOOTING.md\`
          EOF

          cat > workbench-src/WORKBENCH_SOURCE_MANIFEST.json <<EOF
          {
            "workbenchVersion": "${WORKBENCH_VERSION}",
            "harnessVersion": "${HARNESS_VERSION}",
            "harnessCommit": "${HARNESS_SHA}",
            "upstreamRepository": "${HARNESS_REPO}",
            "sourceLayout": "complete-upstream-source-plus-integrated-.workbench",
            "generatedBy": ".github/workflows/sync-full-workbench-source.yml",
            "autoSyncWorkbenchChanges": true
          }
          EOF

      - name: Audit assembled tree
        shell: bash
        run: |
          set -euo pipefail
          test -f workbench-src/package.json
          test -f workbench-src/apps/cli/package.json
          test -f workbench-src/apps/web/package.json
          test -f workbench-src/python/sdk/pyproject.toml
          test -f workbench-src/.workbench/bin/install-workbench.sh
          test -f workbench-src/.workbench/overlay/agent-presets/chatgpt-takeover/agent.cordis.template.yml
          test -f workbench-src/.workbench/overlay/skills/repo-review/SKILL.md
          test -f workbench-src/.workbench/docs/CAPABILITIES.md
          test -f workbench-src/WORKBENCH_SOURCE_MANIFEST.json

          SOURCE_FILES=$(find workbench-src -type f | wc -l | tr -d ' ')
          SOURCE_BYTES=$(du -sb workbench-src | awk '{print $1}')
          echo "完整源码文件数：$SOURCE_FILES"
          echo "完整源码字节数：$SOURCE_BYTES"
          if [ "$SOURCE_FILES" -lt 7000 ]; then
            echo "源码文件数异常，拒绝提交：$SOURCE_FILES" >&2
            exit 1
          fi

      - name: Commit complete source to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A workbench-src
          if git diff --cached --quiet; then
            echo '完整源码无变化，无需提交。'
            exit 0
          fi
          git commit -m "feat: sync complete modified workbench source"
          git push origin HEAD:main
