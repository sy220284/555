name: unity-g1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ProjectSettings/**'
      - 'Packages/**'
      - 'Tools/run_unity_g1.py'
      - 'Tools/verify_hosted_unity_g1.py'
      - 'Tools/project_structure_validator.py'
      - '.github/workflows/unity-g1.yml'
  pull_request:
    paths:
      - 'ProjectSettings/**'
      - 'Packages/**'
      - 'Tools/run_unity_g1.py'
      - 'Tools/verify_hosted_unity_g1.py'
      - 'Tools/project_structure_validator.py'
      - '.github/workflows/unity-g1.yml'

permissions:
  contents: read

concurrency:
  group: unity-g1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  github-hosted-unity-validation:
    if: >-
      ${{ vars.UNITY_GITHUB_HOSTED_ENABLED == 'true' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Run structural preflight
        run: python Tools/project_structure_validator.py
      - name: Compile project and run EditMode tests in Unity 6000.3.24f1
        id: unity-tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.3.24f1
          testMode: EditMode
          artifactsPath: Artifacts/unity-g1-hosted
      - name: Verify required G1 evidence
        run: python Tools/verify_hosted_unity_g1.py Artifacts/unity-g1-hosted
      - name: Upload hosted Unity G1 logs, test results and resolved package lock
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unity-g1-hosted-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            Artifacts/unity-g1-hosted/**
            Packages/packages-lock.json
          if-no-files-found: warn
          retention-days: 14

  unity-editor-validation:
    if: >-
      ${{ vars.UNITY_EDITOR_PATH != '' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, unity-6000.3.24f1]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Run structural preflight
        run: python Tools/project_structure_validator.py
      - name: Compile project and run EditMode tests in Unity 6000.3.24f1
        env:
          UNITY_EDITOR_PATH: ${{ vars.UNITY_EDITOR_PATH }}
        run: python Tools/run_unity_g1.py
      - name: Upload Unity G1 logs, test results and resolved package lock
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unity-g1-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            Artifacts/unity-g1/**
            Packages/packages-lock.json
          if-no-files-found: warn
          retention-days: 14
