[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[project]
name = "deepseek-harness-sdk"
version = "0.0.0.dev0"
description = "Python SDK for DeepSeek Harness"
readme = { text = "555 工作台 Python 组件。完整技术文档见仓库根 README.md。", content-type = "text/markdown" }
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "DeepSeek" }]
dependencies = [
  "pydantic>=2.12,<3",
  "deepseek-harness-runtime-bin==0.0.0.dev0",
]

[project.urls]
Homepage = "https://github.com/sy220284/555"
Documentation = "https://github.com/sy220284/555/blob/main/README.md"
Issues = "https://github.com/sy220284/555/issues"
Source = "https://github.com/sy220284/555"

[dependency-groups]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/deepseek_harness"]

# Editable installs see runtime executables injected after installation instead
# of freezing a wheel snapshot.
[tool.uv.sources]
deepseek-harness-runtime-bin = { path = "../sdk-runtime", editable = true }
