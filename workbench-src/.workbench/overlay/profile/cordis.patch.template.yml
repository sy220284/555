# ChatGPT Takeover host overlay. Shipped bundles/presets remain untouched.
- id: session-query-sqlite
  config:
    path: __DSH_HOME__/storages/session-search.sqlite
    openAt: startup

- insert:
    - id: takeover-mcp-filesystem
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: localfs
        transport: stdio
        command: !!js process.execPath
        args:
          - '__DSH_ROOT__/node_modules/.pnpm/@modelcontextprotocol+server-filesystem@2026.7.10_zod@4.4.3/node_modules/@modelcontextprotocol/server-filesystem/dist/index.js'
          - __MCP_ALLOWED_ROOT__
        toolCallTimeoutMs: 60000
        failOnStartupError: true
        reconnect:
          enabled: true
          initialDelayMs: 500
          maxDelayMs: 30000
          maxAttempts: 10
